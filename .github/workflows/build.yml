name: Build Debug APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Restore signing keystore from secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/dm1sh-signing.jks"
          chmod 600 "${RUNNER_TEMP}/dm1sh-signing.jks"

      - name: Run unit tests & build signed debug APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/dm1sh-signing.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          keytool -printcert -jarfile "$APK_PATH" | head -n 12

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/dm1sh-signing.jks"

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dm1sh.anotherwidget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
