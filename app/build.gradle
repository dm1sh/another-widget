plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def keystorePath = System.getenv("SIGNING_STORE_FILE")
def keystoreFile = keystorePath ? rootProject.file(keystorePath) : rootProject.file("dm1sh-signing.jks")

android {
    namespace = "com.tommasoberlose.anotherwidget"
    compileSdk = 36

    defaultConfig {
        applicationId "dm1sh.anotherwidget"
        minSdk = 23
        targetSdk = 35
        versionCode 142
        versionName "2.4.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            create("dm1sh") {
                storeFile keystoreFile
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.getByName("dm1sh")
            }
        }
        debug {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.getByName("dm1sh")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/*.kotlin_module',
                'META-INF/*.version'
            ]
        }
    }

    buildFeatures {
        //noinspection DataBindingWithoutKapt
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.add("-opt-in=kotlin.RequiresOptIn")
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Core & UI
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.transition:transition:1.5.1'
    implementation 'com.kyleduo.switchbutton:library:2.1.0'
    implementation 'com.github.warkiz:IndicatorSeekBar:v2.1.1'
    // SlimAdapter & me.everything.providers are vendored directly under app/src/main/java

    // Lifecycle & Background Work
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // EventBus
    implementation 'org.greenrobot:eventbus:3.3.1'

    // Room (via KSP)
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    ksp 'androidx.room:room-compiler:2.7.1'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.5'

    // Date/Time
    implementation 'joda-time:joda-time:2.13.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Health Connect (Daily Steps — FOSS replacement for Google Fit)
    implementation 'androidx.health.connect:connect-client:1.1.0'

    // Weather & Networking
    implementation 'com.github.KwabenBerko:OpenWeatherMap-Android-Library:2.0.2'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.github.haroldadmin:NetworkResponseAdapter:4.0.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Preferences
    implementation 'com.chibatching.kotpref:kotpref:2.13.2'
    implementation 'com.chibatching.kotpref:livedata-support:2.13.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Permissions
    implementation 'com.karumi:dexter:6.2.3'

    // Downloadable Fonts list
    implementation 'com.github.firatkarababa:downloadable-font-list-library:1.0.2'
}
